<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UI round</title>
<style>
  :root { --ink:#0f172a; --muted:#64748b; --line:#e7e5e4; --bg:#f4f4f6; --card:#fff; --accent:#ff0069; --add:#047857; --chg:#b45309; --keep:#475569; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14.5px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 32px 20px 80px; }
  .kicker { color: var(--accent); font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  h1 { font-size: 28px; margin: 6px 0 4px; letter-spacing: -.02em; }
  .lede { color: var(--muted); margin: 0 0 22px; max-width: 95ch; }
  section { background:var(--card); border:1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  .pair { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items:start; }
  figure { margin:0; } figcaption { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  figure img { width:100%; height:auto; border:1px solid var(--line); border-radius: 10px; background:#fafafa; }
  .lists { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-top: 12px; }
  .lists h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 4px; }
  .lists ul { margin: 0; padding-left: 18px; } .lists li { margin-bottom: 3px; }
  .add h3 { color: var(--add); } .chg h3 { color: var(--chg); } .keep h3 { color: var(--keep); }
  details { margin-top: 10px; } summary { cursor: pointer; color: var(--muted); font-weight: 650; }
  .idea { margin: 6px 0 0 4px; font-size: 13px; } .idea b { color: var(--ink); } .idea span { color: var(--muted); }
  .his { background:#fff7fa; border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; color:#334155; }
  @media (max-width: 900px) { .pair, .lists { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="kicker" id="kicker">UI round</div>
  <h1 id="title">Before and after</h1>
  <p class="lede" id="lede"></p>
  <div id="items"></div>
</main>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const list = (xs) => (xs && xs.length ? `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p style="margin:0;color:#94a3b8">—</p>')
fetch('round.json').then((r) => r.json()).then((d) => {
  document.getElementById('kicker').textContent = `${d.page} · round ${d.round}`
  document.getElementById('title').textContent = `Round ${d.round}: before and after, per item`
  document.getElementById('lede').textContent = d.lede || `Shots at ${d.viewports.join(' and ')}. Each item: what was added, changed and kept (his picks), and the ideas behind it.`
  const pat = d.shots.pattern
  document.getElementById('items').innerHTML = d.items.map((it) => {
    const img = (dir) => `${dir}/${pat.replace('{id}', it.id)}`
    const his = it.his && (it.his.asked || []).length ? `<div class="his"><b>He asked:</b> ${it.his.asked.map(esc).join(' · ')}</div>` : ''
    const ideas = (it.ideas || []).map((i) => `<div class="idea"><b>${esc(i.id)}${i.chosen ? ' ✓' : i.parked ? ' (next round)' : ''}</b> ${esc(i.what)} <span>— why: ${esc(i.why)}; data: ${esc(i.data)}; comp: ${esc(i.comp)}</span></div>`).join('')
    return `<section><h2>${esc(it.label)}</h2>${his}<div class="pair"><figure><figcaption>Before</figcaption><img loading="lazy" src="${img(d.shots.before)}" alt="${esc(it.label)} before"></figure><figure><figcaption>After</figcaption><img loading="lazy" src="${img(d.shots.after)}" alt="${esc(it.label)} after"></figure></div><div class="lists"><div class="add"><h3>Added</h3>${list(it.added)}</div><div class="chg"><h3>Changed</h3>${list(it.changed)}</div><div class="keep"><h3>Kept (his picks)</h3>${list(it.kept)}</div></div><details><summary>All ${(it.ideas || []).length} ideas</summary>${ideas}</details></section>`
  }).join('')
})
</script>
</body>
</html>
