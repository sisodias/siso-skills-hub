name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Python and run offline tests
        run: |
          python3 --version
          python3 -B -m unittest discover -s tests -p 'test_*.py'
